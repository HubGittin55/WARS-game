<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>WARS — top-down auto-shooter</title>
<!--
  Portable HTML5 build. No bundler, no CDN, no ES modules (so it runs from file://
  on both Linux and Windows 11). Scripts are loaded in dependency order; each one
  attaches itself to the global `WARS` namespace.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05080a; overflow: hidden;
    font-family: ui-monospace, "DejaVu Sans Mono", Consolas, "Courier New", monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  /* Canvas keeps a fixed logical resolution (see Config.VIEW) and is letterboxed
     to the window, so gameplay area is identical on every screen/DPI. */
  #game {
    display: block; image-rendering: pixelated;
    background: #0b1014; box-shadow: 0 0 0 1px #1d2a33, 0 18px 60px rgba(0,0,0,.7);
    cursor: crosshair;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #7f97a8; font-size: 14px; letter-spacing: .12em;
  }
  noscript { color: #ffb4b4; }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>
  <div id="boot">LOADING WARS…</div>
  <noscript><p style="padding:2rem">This game needs JavaScript enabled.</p></noscript>

  <script src="src/config.js"></script>
  <script src="src/util.js"></script>
  <script src="src/input.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/upgrades.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/world.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/director.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
